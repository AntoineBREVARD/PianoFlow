name: Build PianoFlow APK
on:
  push:
    branches: [ccr-116b5ce4-50pvkb, feat/android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Copier le site dans www
        run: mkdir www && cp index.html style.css *.js manifest.json icon.svg www/ && rm www/sw.js
      - run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android
          # micro (mode "vrai piano") et audio
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
