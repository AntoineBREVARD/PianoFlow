name: Build PianoFlow APK
on:
  push:
    branches: [ccr-116b5ce4-50pvkb, feat/android-apk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # android/ est généré après coup : setup-java cache:gradle échouerait (aucun fichier gradle à hacher), d'où actions/cache
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('package.json', 'capacitor.config.json') }}
          restore-keys: gradle-
      - name: Copier le site dans www
        run: mkdir www && cp index.html style.css *.js manifest.json icon.svg www/ && rm www/sw.js
      - name: Vérifier la syntaxe des modules
        run: for f in *.js; do node --check "$f"; done
      - run: node run-tests.mjs
      - name: Vérifier les fichiers du cache hors ligne (sw.js) dans www
        # sw.js est retiré de www (Capacitor sert déjà les fichiers en local) ; il ne doit donc pas être dans www, mais tout le reste de FILES oui
        run: |
          node -e "
          const fs=require('fs');
          const src=fs.readFileSync('sw.js','utf8');
          const files=eval(src.match(/const FILES = (\[[^\]]*\])/)[1]).filter(f=>f!=='./');
          const miss=files.filter(f=>!fs.existsSync('www/'+f));
          for(const m of ['chords.js','train.js','reading.js','ear.js','stats.js','synth.js','mic.js','placement.js','notify.js']) if(!fs.existsSync('www/'+m)) miss.push(m);
          if(fs.existsSync('www/sw.js')) miss.push('www/sw.js (devrait être retiré)');
          if(miss.length){console.error('Fichiers manquants/incohérents :',[...new Set(miss)].join(', '));process.exit(1)}
          console.log('cache OK :',files.length,'fichiers présents dans www')"
      - run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android
          # micro (mode "vrai piano") et audio
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Clé de debug fixe (les mises à jour de l'APK s'installent par-dessus la version précédente)
        # clé de DEBUG uniquement (mot de passe public « android ») : jamais pour le Play Store
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Compiler l'APK
        working-directory: android
        run: for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && exit 0; echo "tentative $i échouée"; sleep 45; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
