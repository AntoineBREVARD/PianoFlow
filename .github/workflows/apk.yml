name: Build PianoFlow APK
on:
  push:
    branches: [ccr-116b5ce4-50pvkb, feat/android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # android/ est généré après coup : setup-java cache:gradle échouerait (aucun fichier gradle à hacher), d'où actions/cache
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('package.json', 'capacitor.config.json') }}
          restore-keys: gradle-
      - name: Copier le site dans www
        run: mkdir www && cp index.html style.css *.js manifest.json icon.svg www/ && rm www/sw.js
      - run: node test.mjs
      - run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android
          # micro (mode "vrai piano") et audio
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Compiler l'APK
        working-directory: android
        run: for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && exit 0; echo "tentative $i échouée"; sleep 45; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
